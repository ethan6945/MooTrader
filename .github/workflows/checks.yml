name: checks

# Runs the isolated half of the Phase-0 suite: everything that needs no real
# .env, no OpenD connection and no network.
#
# The two that are excluded — config_baseline and check_no_secrets — read THIS
# MACHINE's live configuration. On a runner there is no .env to compare against,
# so they would not merely fail; check_no_secrets would report "clean" about a
# file that was never there, which is worse than not running it. They stay local
# checks, run before a push.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # A ceiling above the sum of the per-suite timeouts in run_checks.py, so a
    # hang is caught there — with the suite named — rather than here as an
    # anonymous job timeout.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install only what the isolated suites import
        run: |
          python -m pip install --upgrade pip
          # Not requirements.txt: that pulls moomoo, pandas-ta and the ML stack
          # for a job that never opens a broker connection. These are what the
          # modules under test actually import.
          pip install flask pandas numpy python-dotenv pytz

      - name: Confirm the runner has no .env
        run: |
          if [ -f .env ]; then
            echo "A .env exists on the runner — the isolated suites are supposed"
            echo "to run without one. Refusing, because a suite that silently"
            echo "reads a real config is not testing what it claims."
            exit 1
          fi
          echo "no .env present, as expected"

      - name: Run isolated checks
        run: python scripts/run_checks.py --ci

      - name: Show output on failure
        if: failure()
        run: python scripts/run_checks.py --ci -v || true
