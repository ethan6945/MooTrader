# requirements.lock — EXACT versions, for reproducible installs and packaging.
#
# WHY THIS FILE EXISTS (2026-07-28)
# requirements.txt is intentionally loose (`>=`) for day-to-day development.
# That is fine for one machine and dangerous for a distributed build: on
# 2026-07-28 the declared floor and the actually-installed version had drifted
# a full major release apart on three packages that decide what this bot does —
#
#     declared            installed
#     pandas>=2.2.0   ->  3.0.3        copy-on-write + rolling/resample changes
#     numpy>=1.26.0   ->  2.4.6        casting-rule changes
#     moomoo-api>=9.3 ->  10.8.6808    the BROKER SDK — order placement itself
#
# This project's whole validation story is live<->backtest numerical parity
# (see backtest_v3 / ENTRY_CHASE_TOL / the sandbox diff). With unbounded `>=`,
# two users installing months apart run numerically different strategies, and
# only one of those stacks was ever backtested. Packaged builds and anyone
# reproducing a result MUST install from this file.
#
# USAGE
#   development (loose, follows upstream):   pip install -r requirements.txt
#   packaging / reproducing a result:        pip install -r requirements.lock
#
# REGENERATE after a deliberate, tested upgrade:
#   .venv/bin/python3 -m pip freeze \
#     | grep -viE '^(pyinstaller|altgraph|macholib|pyinstaller-hooks-contrib)==' \
#     > /tmp/body && cat <this header> /tmp/body > requirements.lock
#
# Build-only tools (pyinstaller, altgraph, macholib, pyinstaller-hooks-contrib)
# are deliberately EXCLUDED — they are needed to produce the .app, never to run
# it, and pinning them here would drag them into the bundle.
#
# Captured from the working venv on 2026-07-28, Python 3.11.15, macOS arm64.
# NOTE: these are the versions the bot is currently trading on, not a
# hand-audited set. Pinning freezes the drift in place; it does not undo it.
# If you ever want to move back to the versions the older backtests ran on,
# that is a separate, deliberate downgrade.

